name: Windows native build
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web-public/**'
      - 'tools/**'
      - 'tests/**'
      - 'memory-rules.md'
      - 'requirements-dev.txt'
      - '.github/workflows/windows.yml'
      - '!app/**/*.md'
  workflow_dispatch:
    inputs:
      offline_installer:
        description: Bundle the full WebView2 runtime for offline first installation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify source provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content source-manifest.json -Raw | ConvertFrom-Json
          foreach ($f in $m.files.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath $f.Name -Algorithm SHA256).Hash.ToLowerInvariant() -ne $f.Value.sha256) { throw "Source mismatch: $($f.Name)" }
          }
          if (Test-Path data) { throw 'Competition input directory must not be present' }
      - name: Select installed native toolchain
        id: rust
        run: |
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc -vV
          $version = (rustc --version).Replace(' ', '-')
          "version=$version" >> $env:GITHUB_OUTPUT
          "image=$env:ImageOS" >> $env:GITHUB_OUTPUT
      - name: Locate download caches
        id: download-paths
        run: |
          "npm=$(npm config get cache)" >> $env:GITHUB_OUTPUT
          "pip=$(python -m pip cache dir)" >> $env:GITHUB_OUTPUT
          "nsis=$env:LOCALAPPDATA/tauri/NSIS" >> $env:GITHUB_OUTPUT
      - name: Restore npm, pip and NSIS downloads
        id: download-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.download-paths.outputs.npm }}
            ${{ steps.download-paths.outputs.pip }}
            ${{ steps.download-paths.outputs.nsis }}
          key: windows-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.image }}-node${{ steps.node.outputs.node-version }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('app/package-lock.json', 'web-public/package-lock.json', 'requirements-dev.txt', 'app/build-kernel.py', '.github/workflows/windows.yml') }}
          restore-keys: |
            windows-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.image }}-node${{ steps.node.outputs.node-version }}-py${{ steps.python.outputs.python-version }}-
      - name: Restore Cargo dependencies and compiled libraries
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/src-tauri/target/release/.fingerprint/
            app/src-tauri/target/release/build/
            app/src-tauri/target/release/deps/
            app/src-tauri/target/x86_64-pc-windows-msvc/release/.fingerprint/
            app/src-tauri/target/x86_64-pc-windows-msvc/release/build/
            app/src-tauri/target/x86_64-pc-windows-msvc/release/deps/
          # App-owned outputs are removed before caching; source-only commits can reuse dependencies.
          key: windows-cargo-v2-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('app/src-tauri/Cargo.lock', 'app/src-tauri/Cargo.toml') }}
          restore-keys: |
            windows-cargo-v1-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('app/src-tauri/Cargo.lock', 'app/src-tauri/Cargo.toml') }}-
      - name: Invalidate project outputs and install locked dependencies
        run: |
          # Only dependency libraries are reused. Recompile app-owned code/resources;
          # never restore a final executable, kernel, installer or resource manifest.
          foreach ($profile in @('app/src-tauri/target/release', 'app/src-tauri/target/x86_64-pc-windows-msvc/release')) {
            foreach ($dir in @('.fingerprint', 'build', 'deps')) {
              if (Test-Path "$profile/$dir") {
                Get-ChildItem "$profile/$dir" | Where-Object { $_.Name -like 'ai-memory-lab-*' -or $_.Name -like 'ai_memory_lab-*' } | Remove-Item -Recurse -Force
              }
            }
          }
          python --version
          node --version
          # Build only from an isolated stdlib + pinned packaging/test environment.
          python -m venv .venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$pwd/.venv/Scripts" >> $env:GITHUB_PATH
          ./.venv/Scripts/python -m pip install PyInstaller==6.16.0 pyinstaller-hooks-contrib==2026.9 -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefer-offline --prefix app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefer-offline --prefix web-public
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Desktop persistence and UI contracts
        run: |
          node tools/check_windows_release.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:MEMORY_LAB_PYTHON = (Get-Command python).Source
          python -B -m pytest -q -p no:cacheprovider tests/test_desktop_service.py -k 'not replay_export and not submission_typed'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix web-public run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build native Python kernel and verify standalone operation
        run: |
          npm --prefix app run kernel:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix app run kernel:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tools/check_native_worker.py app/src-tauri/binaries/memory-kernel-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $license = Join-Path $env:pythonLocation 'LICENSE.txt'
          if (!(Test-Path $license)) { throw 'Python runtime license missing' }
          Add-Content app/THIRD_PARTY_NOTICES.txt "`nBundled Windows Python runtime license:`n"
          Get-Content $license -Raw | Add-Content app/THIRD_PARTY_NOTICES.txt
          npm --prefix app run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native network, worker bridge and Windows Credential Manager tests
        run: |
          # Match the installer's release/target profile, avoiding a second debug build.
          # Release tests resolve the native kernel next to the test executable.
          $deps = 'app/src-tauri/target/x86_64-pc-windows-msvc/release/deps'
          New-Item -ItemType Directory -Force $deps | Out-Null
          Copy-Item app/src-tauri/binaries/memory-kernel-x86_64-pc-windows-msvc.exe "$deps/memory-kernel.exe" -Force
          cargo test --release --target x86_64-pc-windows-msvc --locked --manifest-path app/src-tauri/Cargo.toml -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build unsigned Windows x64 NSIS installer
        run: |
          if ('${{ inputs.offline_installer }}' -eq 'true') {
            'MEMORY_LAB_WEBVIEW_MODE=offlineInstaller' >> $env:GITHUB_ENV
            $override = Join-Path $env:RUNNER_TEMP 'memory-offline-config.json'
            @{bundle=@{windows=@{webviewInstallMode=@{type='offlineInstaller'}}}} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $override
            # npm's desktop:windows ends in `-- --locked`; append no Tauri flags
            # after that Cargo separator. Invoke the same CLI with config first.
            Push-Location app
            try {
              & ./node_modules/.bin/tauri.cmd build --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json --config $override --ci --no-sign -- --locked
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          } else {
            'MEMORY_LAB_WEBVIEW_MODE=embedBootstrapper' >> $env:GITHUB_ENV
            npm --prefix app run desktop:windows
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify installer, native payload and source hashes
        run: |
          node app/package-windows.mjs --ci-installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem app/ci-artifact/*-setup.exe).FullName
          $payload = Join-Path $env:RUNNER_TEMP 'memory-installer-payload'
          7z x $setup "-o$payload" -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node app/package-windows.mjs --verify-payload app/ci-artifact $payload
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $m = Get-Content app/ci-artifact/windows-manifest.json -Raw | ConvertFrom-Json
          if ($m.payload.kernel_size -ge 50000000) { throw 'Kernel exceeds the 50 MB budget' }
          "## Windows build sizes (bytes)" >> $env:GITHUB_STEP_SUMMARY
          "Kernel onefile EXE (entire bundled runtime): $($m.payload.kernel_size)" >> $env:GITHUB_STEP_SUMMARY
          "Tauri application EXE: $($m.payload.application_size)" >> $env:GITHUB_STEP_SUMMARY
          foreach ($f in $m.files.PSObject.Properties) { "Installer: $($f.Value.size); SHA-256: $($f.Value.sha256)" >> $env:GITHUB_STEP_SUMMARY }
          Get-Content app/src-tauri/binaries/kernel-manifest.json -Raw >> $env:GITHUB_STEP_SUMMARY
          # The standalone kernel lifecycle already ran before Tauri. The strict
          # source -> release -> extracted-payload SHA-256 checks above bind that
          # same tested EXE to this installer; don't repeat its process lifecycle.
      - name: Retain verified installer as private artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AI-Memory-Lab-windows-x64-${{ github.sha }}
          path: app/ci-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove app-owned files from dependency cache
        if: always()
        run: |
          foreach ($profile in @('app/src-tauri/target/release', 'app/src-tauri/target/x86_64-pc-windows-msvc/release')) {
            foreach ($dir in @('.fingerprint', 'build', 'deps')) {
              if (Test-Path "$profile/$dir") {
                Get-ChildItem "$profile/$dir" | Where-Object { $_.Name -like 'ai-memory-lab-*' -or $_.Name -like 'ai_memory_lab-*' -or $_.Name -eq 'memory-kernel.exe' } | Remove-Item -Recurse -Force
              }
            }
          }
      - name: Save compiled dependency cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true' && steps.rust.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/src-tauri/target/release/.fingerprint/
            app/src-tauri/target/release/build/
            app/src-tauri/target/release/deps/
            app/src-tauri/target/x86_64-pc-windows-msvc/release/.fingerprint/
            app/src-tauri/target/x86_64-pc-windows-msvc/release/build/
            app/src-tauri/target/x86_64-pc-windows-msvc/release/deps/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save downloaded dependencies even after a later failure
        if: always() && steps.download-cache.outcome == 'success' && steps.download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.download-paths.outputs.npm }}
            ${{ steps.download-paths.outputs.pip }}
            ${{ steps.download-paths.outputs.nsis }}
          key: ${{ steps.download-cache.outputs.cache-primary-key }}
  release:
    needs: windows
    if: github.event_name == 'push' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AI-Memory-Lab-windows-x64-${{ github.sha }}
          path: release-input
      - name: Verify the exact Windows artifact before publishing
        run: node app/package-windows.mjs --verify-publishable release-input "$GITHUB_SHA"
      - name: Publish private Windows Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          installer=$(node -e "const m=require('./release-input/windows-manifest.json');process.stdout.write(Object.keys(m.files)[0])")
          tag="windows-v${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "release-input/$installer" release-input/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AI Memory Lab $version · Windows x64 · build $GITHUB_RUN_ID" \
            --notes "Unsigned Windows x64 installer from commit $GITHUB_SHA. Uses installed WebView2; if absent, runtime installation requires internet. Automated Windows build, tests, NSIS payload and SHA-256 verification completed in this workflow. Windows desktop installation, real model API and human interaction remain unverified."
