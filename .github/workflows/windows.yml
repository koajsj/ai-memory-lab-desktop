name: Windows native build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify source provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content source-manifest.json -Raw | ConvertFrom-Json
          foreach ($f in $m.files.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath $f.Name -Algorithm SHA256).Hash.ToLowerInvariant() -ne $f.Value.sha256) { throw "Source mismatch: $($f.Name)" }
          }
          if (Test-Path data) { throw 'Competition input directory must not be present' }
      - name: Native toolchain and locked dependencies
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc -vV
          python --version
          node --version
          python -m pip install PyInstaller==6.16.0 -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix web-public
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Desktop persistence and UI contracts
        run: |
          $env:MEMORY_LAB_PYTHON = (Get-Command python).Source
          python -B -m pytest -q -p no:cacheprovider tests/test_desktop_service.py -k 'not replay_export and not submission_typed'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix web-public run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/check_windows_release.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build native Python kernel and verify standalone operation
        run: |
          npm --prefix app run kernel:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix app run kernel:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tools/check_native_worker.py app/src-tauri/binaries/memory-kernel-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $license = Join-Path $env:pythonLocation 'LICENSE.txt'
          if (!(Test-Path $license)) { throw 'Python runtime license missing' }
          Add-Content app/THIRD_PARTY_NOTICES.txt "`nBundled Windows Python runtime license:`n"
          Get-Content $license -Raw | Add-Content app/THIRD_PARTY_NOTICES.txt
          npm --prefix app run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native network, worker bridge and Windows Credential Manager tests
        run: |
          $env:MEMORY_LAB_PYTHON = (Get-Command python).Source
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build unsigned Windows x64 NSIS installer
        run: |
          npm --prefix app run desktop:windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify installer, native payload and source hashes
        run: |
          node app/package-windows.mjs --ci-installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $manifest = Get-Content app/ci-artifact/windows-manifest.json -Raw | ConvertFrom-Json
          $setup = (Get-ChildItem app/ci-artifact/*-setup.exe).FullName
          $payload = Join-Path $env:RUNNER_TEMP 'memory-installer-payload'
          7z x $setup "-o$payload" -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($item in @(@('ai-memory-lab.exe', $manifest.payload.application_sha256), @('memory-kernel.exe', $manifest.payload.kernel_sha256))) {
            $found = @(Get-ChildItem $payload -Recurse -File | Where-Object Name -eq $item[0])
            if ($found.Count -ne 1 -or (Get-FileHash $found[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item[1]) { throw "Installer payload mismatch: $($item[0])" }
          }
          python -B tools/check_native_worker.py app/src-tauri/target/x86_64-pc-windows-msvc/release/memory-kernel.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain verified installer as private artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AI-Memory-Lab-windows-x64-${{ github.sha }}
          path: app/ci-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
